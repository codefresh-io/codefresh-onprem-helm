global:
  appUrl: "" # placeholder for ${ONPREM_INGRESS_HOSTNAME} set in CI pipeline
  imagePullSecrets:
    - codefresh-registry
    - dockerhub-creds

  nodeSelector:
    node-type: fast-image-pull

    tolerations:
    - key: codefresh.io
      operator: Equal
      value: fast-image-pull
      effect: NoSchedule

ingress:
  enabled: true
  ingressClassName: haproxy-ingress
  tls:
    enabled: false

ingress-nginx:
  enabled: false

consul:
  image:
    repository: bitnamilegacy/consul

nats:
  image:
    repository: bitnamilegacy/nats

hooks:
  mongodb:
    nodeSelector:
      kubernetes.io/arch: amd64
  rabbitmq:
    nodeSelector:
      kubernetes.io/arch: amd64

mongodb:
  nodeSelector:
    kubernetes.io/arch: amd64
