{{- $cfCommonTplSemver := printf "cf-common-%s" (index .Subcharts "cf-common").Chart.Version }}
{{- $httpRouteName := printf "%s-httproute" (include "codefresh.fullname" .) }}
{{- if and (hasKey .Values.httpRoute "nameOverride") .Values.httpRoute.nameOverride }}
  {{- $httpRouteName = .Values.httpRoute.nameOverride }}
{{- end }}
{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $httpRouteName }}
  labels:
    {{ include "codefresh.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.labels }}
    {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
  {{- if .Values.httpRoute.parentRefs }}
    {{- include (printf "%s.tplrender" $cfCommonTplSemver) (dict "Values" .Values.httpRoute.parentRefs "context" .) | nindent 4 }}
  {{- else }}
    {{- fail "ERROR: httpRoute.parentRefs is required when httpRoute is enabled" }}
  {{- end }}
  hostnames: {{- include (printf "%s.tplrender" $cfCommonTplSemver) (dict "Values" .Values.httpRoute.hostnames "context" .) | nindent 4 }}
  rules:
    {{- range $serviceName, $paths := .Values.httpRoute.services }}
      {{- if and (index $.Subcharts $serviceName) }}
        {{- range $path := $paths }}
  - matches:
      - path:
          type: PathPrefix
          value: {{ $path }}
    backendRefs:
      {{- $fullServiceName := (index $.Subcharts $serviceName).Values.fullnameOverride }}
      {{- if $fullServiceName }}
      - name: {{ $fullServiceName }}
      {{- else }}
      - name: {{ printf "%s-%s" $.Release.Name (index $.Subcharts $serviceName ).Chart.Name }}
      {{- end }}
        port: {{ (index $.Subcharts $serviceName ).Values.service.main.ports.http.port }}
        {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
