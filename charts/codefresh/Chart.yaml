apiVersion: v2
description: Helm Chart for Codefresh On-Prem
name: codefresh
version: 2.11.8
keywords:
  - codefresh
home: https://codefresh.io/
icon: https://avatars1.githubusercontent.com/u/11412079?v=3
sources:
  - https://github.com/codefresh-io/codefresh-onprem-helm
maintainers:
  - name: codefresh
    url: https://codefresh-io.github.io/
appVersion: 0.0.0
annotations:
  artifacthub.io/prerelease: "false"
  artifacthub.io/alternativeName: "codefresh-onprem"
  artifacthub.io/containsSecurityUpdates: "true"
  # supported kinds are added, changed, deprecated, removed, fixed and security.
  # artifacthub.io/changes: |
  #   - kind:
  #     description: ""
  artifacthub.io/changes: |-
    - kind: changed
      description: 'update "argo-platform" to 1.4073.5'
    - kind: changed
      description: 'update "nomios" to 0.11.18'
    - kind: changed
      description: 'update "runner" to 2.0.10'
    - kind: changed
      description: 'update "template-engine" to 0.15.1'
    - kind: changed
      description: 'update "codefresh/cli" to 1.1.4-rootless'
    - kind: changed
      description: 'update "pipeline-debugger" to 1.3.14'
    - kind: changed
      description: 'update "fs-ops" to 1.2.13'
    - kind: changed
      description: 'update "gc-builder" to 0.5.10'
    - kind: changed
      description: 'update "compose" to v5.1.3-1.6.4'
    - kind: changed
      description: 'update "dind" to 29.4.1-3.0.15'
    - kind: changed
      description: 'update "docker-builder" to 1.6.1'
    - kind: changed
      description: 'update "engine" to 3.2.8'
    - kind: changed
      description: 'update "git-cloner" to 10.3.11'
    - kind: changed
      description: 'update "docker-pusher" to 6.0.26'
    - kind: changed
      description: 'update "kubectl" to 1.35.4'
    - kind: fixed
      description: 'fix support for Git LFS in "clone" step'
    - kind: security
      description: 'fix various security vulnerabilities in different components'
dependencies:
  - name: cf-common
    repository: oci://quay.io/codefresh/charts
    version: 0.18.1
  - name: internal-gateway
    repository: oci://quay.io/codefresh/charts
    version: 0.11.0
    condition: internal-gateway.enabled
  - name: consul
    version: 11.4.32
    repository: https://charts.bitnami.com/bitnami
    condition: consul.enabled
  - name: mongodb
    version: 15.6.26
    repository: https://charts.bitnami.com/bitnami
    condition: mongodb.enabled,mongo.enabled,global.mongoDeploy
  - name: postgresql
    version: 16.7.15
    repository: https://charts.bitnami.com/bitnami
