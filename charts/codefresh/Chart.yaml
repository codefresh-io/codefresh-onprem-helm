  #     description: ""
  artifacthub.io/changes: |
    - kind: changed
      description: 'Release 2.12.24'
      links:
        - name: 'Release notes'
          url: 'https://github.com/codefresh-io/codefresh-onprem-helm/releases/tag/codefresh-2.12.24'
