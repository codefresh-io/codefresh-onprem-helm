apiVersion: v2
description: Helm Chart for Codefresh On-Prem
name: codefresh
version: 2.11.24
keywords:
  - codefresh
home: https://codefresh.io/
icon: https://avatars1.githubusercontent.com/u/11412079?v=3
sources:
  - https://github.com/codefresh-io/codefresh-onprem-helm
maintainers:
  - name: codefresh
    url: https://codefresh-io.github.io/
appVersion: 0.0.0
annotations:
  artifacthub.io/prerelease: "false"
  artifacthub.io/alternativeName: "codefresh-onprem"
  artifacthub.io/containsSecurityUpdates: "true"
  # supported kinds are added, changed, deprecated, removed, fixed and security.
  # artifacthub.io/changes: |
  #   - kind:
  #     description: ""
  artifacthub.io/changes: |-
    - kind: security
      description: 'Update "argo-hub-platform" to version 0.1.42. Security fixes.'
    - kind: security
      description: 'Update "context-manager" to version 2.40.7. Security fixes.'
    - kind: security
      description: 'Update "runtime-environment-manager" to version 4.1.6. Security fixes.'
    - kind: security
      description: 'Update "cf-ui" to version 14.100.13. Security fixes.'
    - kind: security
      description: 'Update "charts-manager" to version 1.28.6. Security fixes.'
    - kind: security
      description: 'Update "kube-integration" to version 1.33.14. Security fixes.'
    - kind: security
      description: 'Update "tasker-kubernetes" to version 1.28.14. Security fixes.'
    - kind: security
      description: 'Update "cf-api" to version 22.3.16. Security fixes.'
    - kind: security
      description: 'Update "cf-tls-sign" to version 1.8.22. Security fixes.'
    - kind: security
      description: 'Update "pipeline-manager" to version 4.1.10. Security fixes.'
    - kind: security
      description: 'Update "dind" to version 29.6.1-3.0.19. Security fixes.'
    - kind: security
      description: 'Update "engine" to version 3.2.25. Security fixes.'
    - kind: security
      description: 'Update "compose" to version v5.2.0-1.6.7. Security fixes.'
    - kind: security
      description: 'Update "cf-container-logger" to version 2.0.29. Security fixes.'
    - kind: security
      description: 'Update "cf-docker-builder" to version 1.6.7. Security fixes.'
    - kind: security
      description: 'Update "cf-docker-puller" to version 8.0.39. Security fixes.'
    - kind: security
      description: 'Update "cf-docker-pusher" to version 6.0.32. Security fixes.'
    - kind: security
      description: 'Update "pikolo" to version 0.15.4. Security fixes.'
dependencies:
  - name: cf-common
    repository: oci://quay.io/codefresh/charts
    version: 0.18.1
  - name: internal-gateway
    repository: oci://quay.io/codefresh/charts
    version: 0.12.3
    condition: internal-gateway.enabled
  - name: consul
    version: 11.4.32
    repository: https://charts.bitnami.com/bitnami
    condition: consul.enabled
  - name: mongodb
    version: 15.6.26
    repository: https://charts.bitnami.com/bitnami
    condition: mongodb.enabled,mongo.enabled,global.mongoDeploy
  - name: postgresql
    version: 16.7.15
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: postgresql-ha
    version: 12.0.4
    repository: oci://quay.io/codefresh/charts
